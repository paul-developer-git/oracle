name: Oracle Ampere A1 Provisioner

on:
  schedule:
    # Versucht es alle 15 Minuten
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manueller Start-Button

jobs:
  launch-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          region=${{ secrets.OCI_CLI_REGION }}
          EOF

      - name: Create SSH Key File
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ssh_key.pub

      - name: Attempt Instance Creation
        id: create_vm
        run: |
          # Führe OCI-Befehl aus und fange Fehler ab
          oci compute instance launch \
            --availability-domain "${{ secrets.OCI_AD_NAME }}" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --display-name "Free-Ampere-A1" \
            --ssh-authorized-keys-file ssh_key.pub \
            --assign-public-ip true > oci_output.json 2>&1 || true

          # Schreibe die Antwort für einfache Lesbarkeit direkt in die GitHub-Zusammenfassung
          echo "### OCI Antwort:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat oci_output.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if grep -q "OutOfCapacity" oci_output.json; then
            echo "STATUS=OutOfCapacity" >> $GITHUB_OUTPUT
            echo "Keine Kapazität verfügbar. Nächster Versuch folgt automatisch."
            exit 0
          elif grep -q '"lifecycle-state": "PROVISIONING"' oci_output.json; then
            echo "STATUS=Success" >> $GITHUB_OUTPUT
            echo "🎉 INSTANZ ERFOLGREICH ERSTELLT!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "Anderer Fehler aufgetreten!"
            exit 1
          fi

      - name: Disable Workflow on Success
        if: steps.create_vm.outputs.STATUS == 'Success'
        run: |
          echo "Instanz wurde erstellt. Schalte Workflow ab..."
          gh workflow disable oracle_provision.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
